<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="title desc">
  <title id="title">第13-14章偏导数与多重积分依赖图</title>
  <desc id="desc">第13章从多变量函数、极限、偏导、链式法则、方向导数、切平面、极值、Lagrange乘数到Taylor公式；第14章从二重积分、一般区域、极坐标、三重积分、物理应用、柱球坐标到换元和Jacobian。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#687670"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19231f" flood-opacity=".08"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19231f}
      .lane{font-family:Georgia,serif;font-size:19px;font-weight:700;fill:#315f87}
      .title{font-size:12.5px;font-weight:700}.sub{font-size:10.2px;fill:#596660}
      .row{font-size:10px;font-weight:700;fill:#73817b;letter-spacing:.08em}
      .node{filter:url(#shadow)}.node rect{stroke-width:1.5;rx:12}
      .c13 rect{fill:#dfe9f1;stroke:#89aac5}.c14 rect{fill:#f4e3ca;stroke:#d5aa73}
      .bridge rect{fill:#223330;stroke:#223330}.bridge text{fill:#f5f0e6}
      .edge{fill:none;stroke:#687670;stroke-width:1.8;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#95a19b;stroke-width:1.4;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1180" height="820" fill="#fffdf8"/>
  <path d="M24 395H1156" stroke="#d8d1c4" stroke-dasharray="4 7"/>

  <text x="32" y="38" class="lane">Chapter 13 · Partial Derivatives</text>
  <text x="32" y="58" class="sub">从多变量函数的局部变化走向梯度、切平面、极值、约束与Taylor近似。</text>
  <text x="32" y="91" class="row">A · 定义域、极限与局部导数</text>
  <g class="node c13" transform="translate(28 108)"><rect width="205" height="84"/><text x="14" y="24" class="title">13.1 Several Variables</text><text x="14" y="45" class="sub">domain · graph · level sets</text><text x="14" y="63" class="sub">open/closed · boundary</text><text x="14" y="78" class="sub">functions as surfaces</text></g>
  <g class="node c13" transform="translate(257 108)"><rect width="205" height="84"/><text x="14" y="24" class="title">13.2 Limits &amp; Continuity</text><text x="14" y="45" class="sub">multi-path limit</text><text x="14" y="63" class="sub">continuous at a point</text><text x="14" y="78" class="sub">limit laws</text></g>
  <g class="node c13" transform="translate(486 108)"><rect width="205" height="84"/><text x="14" y="24" class="title">13.3 Partial Derivatives</text><text x="14" y="45" class="sub">hold other variables fixed</text><text x="14" y="63" class="sub">mixed derivatives</text><text x="14" y="78" class="sub">differentiability · continuity</text></g>
  <g class="node c13" transform="translate(715 108)"><rect width="205" height="84"/><text x="14" y="24" class="title">13.4 Chain Rule</text><text x="14" y="45" class="sub">dependency diagrams</text><text x="14" y="63" class="sub">composites and surfaces</text><text x="14" y="78" class="sub">implicit derivatives</text></g>
  <g class="node c13" transform="translate(944 108)"><rect width="205" height="84"/><text x="14" y="24" class="title">13.5 Directional Derivatives</text><text x="14" y="45" class="sub">gradient · steepest ascent</text><text x="14" y="63" class="sub">level-curve normal</text><text x="14" y="78" class="sub">derivative along a path</text></g>

  <text x="32" y="224" class="row">B · 用局部线性结构与导数值分类整体行为</text>
  <g class="node c13" transform="translate(28 241)"><rect width="266" height="100"/><text x="14" y="24" class="title">13.6 Tangent Planes &amp; Differentials</text><text x="14" y="45" class="sub">gradient normal to level surface</text><text x="14" y="63" class="sub">tangent plane z=f(x,y)</text><text x="14" y="81" class="sub">linearization · total differential</text></g>
  <g class="node c13" transform="translate(318 241)"><rect width="266" height="100"/><text x="14" y="24" class="title">13.7 Extrema &amp; Saddle Points</text><text x="14" y="45" class="sub">critical points · boundary points</text><text x="14" y="63" class="sub">Hessian / discriminant</text><text x="14" y="81" class="sub">local vs absolute extrema</text></g>
  <g class="node c13" transform="translate(608 241)"><rect width="266" height="100"/><text x="14" y="24" class="title">13.8 Lagrange Multipliers</text><text x="14" y="45" class="sub">grad f = λ grad g</text><text x="14" y="63" class="sub">constraints · equations</text><text x="14" y="81" class="sub">orthogonal gradient geometry</text></g>
  <g class="node c13" transform="translate(898 241)"><rect width="251" height="100"/><text x="14" y="24" class="title">13.9–13.10 Taylor &amp; Constraints</text><text x="14" y="45" class="sub">quadratic approximation</text><text x="14" y="63" class="sub">Taylor remainder</text><text x="14" y="81" class="sub">dependent/independent variables</text></g>

  <text x="32" y="404" class="lane">Chapter 14 · Multiple Integrals</text>
  <text x="32" y="424" class="sub">从二维/三维累积求和走向区域、坐标变换与 Jacobian。</text>
  <text x="32" y="457" class="row">C · 二重积分与区域</text>
  <g class="node c14" transform="translate(28 474)"><rect width="235" height="82"/><text x="14" y="24" class="title">14.1 Rectangular Regions</text><text x="14" y="45" class="sub">Riemann sum · dA</text><text x="14" y="63" class="sub">Fubini first form</text></g>
  <g class="node c14" transform="translate(287 474)"><rect width="235" height="82"/><text x="14" y="24" class="title">14.2 General Regions</text><text x="14" y="45" class="sub">y-limits / x-limits</text><text x="14" y="63" class="sub">reverse order</text></g>
  <g class="node c14" transform="translate(546 474)"><rect width="235" height="82"/><text x="14" y="24" class="title">14.3 Area</text><text x="14" y="45" class="sub">A=∫∫₁ dA</text><text x="14" y="63" class="sub">average value</text></g>
  <g class="node c14" transform="translate(805 474)"><rect width="344" height="82"/><text x="14" y="24" class="title">14.4 Polar Double Integrals</text><text x="14" y="45" class="sub">dA = r dr dθ · polar region limits</text><text x="14" y="63" class="sub">area and circular symmetry</text></g>

  <text x="32" y="588" class="row">D · 三重积分、物理应用与换元</text>
  <g class="node c14" transform="translate(28 605)"><rect width="232" height="96"/><text x="14" y="24" class="title">14.5 Triple Integrals</text><text x="14" y="45" class="sub">dV · three iterated limits</text><text x="14" y="63" class="sub">volume · average over solid</text><text x="14" y="81" class="sub">order of integration</text></g>
  <g class="node c14" transform="translate(284 605)"><rect width="232" height="96"/><text x="14" y="24" class="title">14.6 Applications</text><text x="14" y="45" class="sub">mass · first moments</text><text x="14" y="63" class="sub">centroid · inertia</text><text x="14" y="81" class="sub">joint probability density</text></g>
  <g class="node c14" transform="translate(540 605)"><rect width="280" height="96"/><text x="14" y="24" class="title">14.7 Cylindrical &amp; Spherical</text><text x="14" y="45" class="sub">dV = r dz dr dθ</text><text x="14" y="63" class="sub">dV = ρ² sin φ dρ dφ dθ</text><text x="14" y="81" class="sub">coordinate surfaces</text></g>
  <g class="node c14" transform="translate(844 605)"><rect width="305" height="96"/><text x="14" y="24" class="title">14.8 Substitutions</text><text x="14" y="45" class="sub">transformation T · one-to-one</text><text x="14" y="63" class="sub">Jacobian J(u,v)</text><text x="14" y="81" class="sub">double/triple substitution</text></g>

  <g class="node bridge" transform="translate(28 730)"><rect width="1121" height="62"/><text x="18" y="23" class="title">统一策略</text><text x="18" y="44" class="sub">先画定义域或积分区域，再确认独立变量与边界函数；局部问题用偏导/梯度/余项，累积问题用切片元素和坐标变换。</text></g>

