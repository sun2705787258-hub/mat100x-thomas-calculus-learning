<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">第 1–2 章知识依赖图</title>
  <desc id="desc">第 1 章从函数、图形与三角函数建立表示和变换能力；第 2 章从平均变化率进入极限、精确定义、单侧极限、连续性、介值定理和渐近线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#687670"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19231f" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#19231f}
      .title{font-size:16px;font-weight:700}.sub{font-size:12px;fill:#596660}
      .node{filter:url(#shadow)}.node rect{stroke-width:1.5;rx:12}
      .c1 rect{fill:#dcebe6;stroke:#8dbbb1}.c2 rect{fill:#f4e3ca;stroke:#d5aa73}
      .bridge rect{fill:#223330;stroke:#223330}.bridge text{fill:#f5f0e6}
      .edge{fill:none;stroke:#687670;stroke-width:1.8;marker-end:url(#arrow)}
      .accent{fill:none;stroke:#a94b3e;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .lane{font-family:Georgia,serif;font-size:19px;font-weight:700;fill:#0f6761}
      .label{font-size:11px;fill:#925b24;font-weight:700}
    </style>
  </defs>
  <rect width="1120" height="620" fill="#fffdf8"/>
  <path d="M560 30V590" stroke="#d8d1c4" stroke-dasharray="4 7"/>
  <text x="32" y="42" class="lane">Chapter 1 · Functions</text>
  <text x="590" y="42" class="lane">Chapter 2 · Limits and Continuity</text>

  <g class="node c1" transform="translate(28 80)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">1.1 函数与图像</text>
    <text x="18" y="48" class="sub">定义域 · 值域 · 交点检验</text><text x="18" y="64" class="sub">奇偶性 · 函数族</text>
  </g>
  <g class="node c1" transform="translate(292 80)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">1.2 组合与变换</text>
    <text x="18" y="48" class="sub">复合 · 平移 · 伸缩 · 反射</text><text x="18" y="64" class="sub">先做输入，再记方向</text>
  </g>
  <g class="node c1" transform="translate(28 194)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">1.3 三角函数</text>
    <text x="18" y="48" class="sub">弧度 · 周期 · 恒等式</text><text x="18" y="64" class="sub">振幅 · 相位 · 模型</text>
  </g>
  <g class="node c1" transform="translate(292 194)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">1.4 软件绘图</text>
    <text x="18" y="48" class="sub">窗口 · 轴比例 · 采样率</text><text x="18" y="64" class="sub">默认视图可能误导</text>
  </g>

  <g class="node c2" transform="translate(590 80)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">2.1 变化率</text>
    <text x="18" y="48" class="sub">平均速率 · 割线斜率</text><text x="18" y="64" class="sub">瞬时变化 = 切线极限</text>
  </g>
  <g class="node c2" transform="translate(854 80)">
    <rect width="230" height="72"/><text x="18" y="27" class="title">2.2 极限法则</text>
    <text x="18" y="48" class="sub">多项式 · 有理函数</text><text x="18" y="64" class="sub">夹逼 · 极限可失败</text>
  </g>
  <g class="node c2" transform="translate(590 194)">
    <rect width="226" height="72"/><text x="18" y="27" class="title">2.3 ε-δ 定义</text>
    <text x="18" y="48" class="sub">ε 控制输出误差</text><text x="18" y="64" class="sub">δ 控制输入距离</text>
  </g>
  <g class="node c2" transform="translate(854 194)">
    <rect width="230" height="72"/><text x="18" y="27" class="title">2.4 单侧极限</text>
    <text x="18" y="48" class="sub">左、右分别考察</text><text x="18" y="64" class="sub">相等才得双侧极限</text>
  </g>
  <g class="node c2" transform="translate(590 308)">
    <rect width="226" height="86"/><text x="18" y="27" class="title">2.5 连续性</text>
    <text x="18" y="48" class="sub">函数值 · 极限 · 相等</text><text x="18" y="64" class="sub">复合 · 介值定理</text><text x="18" y="80" class="sub">连续延拓 · 零点</text>
  </g>
  <g class="node c2" transform="translate(854 308)">
    <rect width="230" height="86"/><text x="18" y="27" class="title">2.6 无穷与渐近线</text>
    <text x="18" y="48" class="sub">x→±∞ · f→±∞</text><text x="18" y="64" class="sub">水平 / 垂直 / 斜</text><text x="18" y="80" class="sub">主导项</text>
  </g>

  <g class="node bridge" transform="translate(28 368)">
    <rect width="490" height="108"/>
    <text x="20" y="28" class="title">B1 跨章主线</text>
    <text x="20" y="52" class="sub">函数与图形提供“研究对象”，极限提供“局部趋近”的语言。</text>
    <text x="20" y="72" class="sub">连续性把函数值与极限连接起来，介值定理把图形存在性变成可验证结论。</text>
    <text x="20" y="92" class="sub">下一批第 3 章将把瞬时变化率的极限正式命名为导数。</text>
  </g>
  <g class="node" transform="translate(590 474)">
    <rect width="494" height="70" fill="#f8f5ed" stroke="#bdb6a8" stroke-dasharray="6 5"/>
    <text x="20" y="27" class="title">第 3 章：导数 / Derivatives</text>
    <text x="20" y="49" class="sub">B2 内容；本批不提前展开</text>
  </g>

  <path class="edge" d="M254 116H292"/>
  <path class="edge" d="M405 152V194"/>
  <path class="edge" d="M141 152V194"/>
  <path class="edge" d="M254 230H292"/>
  <path class="edge" d="M141 266C180 300 390 300 590 130"/>
  <path class="edge" d="M405 230C440 240 500 260 590 248"/>
  <path class="edge" d="M703 152V194"/>
  <path class="edge" d="M816 116H854"/>
  <path class="edge" d="M969 152V194"/>
  <path class="edge" d="M703 266V308"/>
  <path class="edge" d="M969 266V308"/>
  <path class="edge" d="M816 344H854"/>
  <path class="edge" d="M703 394C698 454 675 474 674 474"/>
  <path class="edge" d="M969 394C967 446 912 474 854 498"/>
  <path class="accent" d="M518 422C570 420 585 392 590 350"/>
  <text x="470" y="452" class="label">连续性依赖极限</text>
  <text x="476" y="480" class="label">B2 将在此建立导数</text>
</svg>
