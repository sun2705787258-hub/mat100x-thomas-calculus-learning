  <path class="edge" d="M278 522H310"/><path class="edge" d="M560 522H592"/><path class="edge" d="M842 522H874"/>
  <path class="soft" d="M435 560C470 575 470 590 490 604"/>
  <path class="soft" d="M717 560C730 577 735 590 742 604"/>
</svg>
