<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">B8 第15至16章知识图</title>
  <desc id="desc">左侧是向量场积分从标量线积分到散度定理的路径，右侧是一阶微分方程从斜率场到相平面的路径。</desc>
  <defs>
    <style>
      .bg{fill:#fbf9f2}.panel{fill:#fff}.head{font:700 23px Georgia,serif;fill:#173f38}.node{stroke:#b9c9c3;fill:#f6fbf9;rx:14}.node2{stroke:#d7c9a7;fill:#fffaf0;rx:14}.title{font:700 14px "Microsoft YaHei",Arial,sans-serif;fill:#173f38}.sub{font:12px "Microsoft YaHei",Arial,sans-serif;fill:#536c66}.label{font:700 12px Arial,sans-serif;fill:#7d6c49;letter-spacing:1px}.edge{stroke:#7ba398;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#c2a86d;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7ba398"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c2a86d"/></marker>
  </defs>
