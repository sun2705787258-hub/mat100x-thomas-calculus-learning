  <rect x="22" y="24" width="530" height="632" class="panel" rx="20" opacity=".78"/>
  <rect x="568" y="24" width="530" height="632" class="panel" rx="20" opacity=".78"/>
  <text x="42" y="58" class="label">BOUNDARY TO INTERIOR</text>
  <text x="42" y="88" class="head">第 15 章 · 向量场积分</text>
  <text x="588" y="58" class="label">FLOW TO DYNAMICS</text>
  <text x="588" y="88" class="head">第 16 章 · 一阶微分方程</text>

  <g transform="translate(42 112)"><rect width="230" height="74" class="node"/><text x="16" y="27" class="title">15.1 标量线积分</text><text x="16" y="50" class="sub">ds = |r′|dt · mass / moments</text></g>
  <g transform="translate(294 112)"><rect width="238" height="74" class="node"/><text x="16" y="27" class="title">15.2 向量场与线积分</text><text x="16" y="50" class="sub">work · circulation · flux</text></g>
  <g transform="translate(42 230)"><rect width="230" height="74" class="node"/><text x="16" y="27" class="title">15.3 路径独立</text><text x="16" y="50" class="sub">potential · component test</text></g>
  <g transform="translate(294 230)"><rect width="238" height="74" class="node"/><text x="16" y="27" class="title">15.4 Green 定理</text><text x="16" y="50" class="sub">boundary ↔ area derivative</text></g>
  <g transform="translate(42 348)"><rect width="230" height="74" class="node"/><text x="16" y="27" class="title">15.5 曲面与面积</text><text x="16" y="50" class="sub">ru × rv · dσ</text></g>
  <g transform="translate(294 348)"><rect width="238" height="74" class="node"/><text x="16" y="27" class="title">15.6 曲面积分</text><text x="16" y="50" class="sub">scalar area · vector flux</text></g>
  <g transform="translate(42 466)"><rect width="230" height="74" class="node"/><text x="16" y="27" class="title">15.7 Stokes 定理</text><text x="16" y="50" class="sub">curl F · oriented boundary</text></g>
  <g transform="translate(294 466)"><rect width="238" height="74" class="node"/><text x="16" y="27" class="title">15.8 散度定理</text><text x="16" y="50" class="sub">closed surface · divergence</text></g>
