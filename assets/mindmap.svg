<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">第 4 章和第 5 章知识依赖图</title>
  <desc id="mapDesc">第 4 章从极值和中值定理出发，发展到单调性、凹凸性、最优化、牛顿法和原函数；第 5 章从有限和与黎曼和出发，通过定积分和微积分基本定理连接原函数、换元和曲线间面积。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d7974"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19231f" flood-opacity=".09"/>
    </filter>
    <style>
      .node { filter:url(#shadow); }
      .node rect { stroke-width:1.5; rx:12; }
      .ch4 rect { fill:#dcebe6; stroke:#8fbbb2; }
      .ch5 rect { fill:#f4e3ca; stroke:#d3a66d; }
      .system rect { fill:#223330; stroke:#223330; }
      .ghost rect { fill:#f8f5ed; stroke:#bdb6a8; stroke-dasharray:6 5; }
      text { fill:#19231f; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
      .title { font-weight:700; font-size:15px; }
      .sub { font-size:11.5px; fill:#52615c; }
      .system text { fill:#f3efe5; }
      .ghost text { fill:#65716c; }
      .edge { fill:none; stroke:#6d7974; stroke-width:1.8; marker-end:url(#arrow); }
      .cross { fill:none; stroke:#a94b3e; stroke-width:2.2; stroke-dasharray:7 5; marker-end:url(#arrow); }
      .label { font-size:11px; fill:#7a4b26; font-weight:700; }
      .lane-title { font-family:Georgia,"Times New Roman",serif; font-size:18px; font-weight:700; fill:#0f6761; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="680" fill="#fffdf8"/>
  <path d="M560 30 V650" stroke="#d8d1c4" stroke-width="1" stroke-dasharray="4 7"/>
  <text x="34" y="43" class="lane-title">Chapter 4 · Applications of Derivatives</text>
  <text x="590" y="43" class="lane-title">Chapter 5 · Integrals</text>

  <g class="node ghost" transform="translate(28 86)">
    <rect width="184" height="56"/>
    <text x="16" y="23" class="title">第 3 章：导数工具</text>
    <text x="16" y="42" class="sub">示范范围外 · 不展开</text>
  </g>

  <g class="node ch4" transform="translate(28 184)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.1 闭区间极值</text>
    <text x="16" y="44" class="sub">Extreme Value Theorem</text>
    <text x="16" y="59" class="sub">临界点 + 端点</text>
  </g>

  <g class="node ch4" transform="translate(252 184)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.2 中值定理</text>
    <text x="16" y="44" class="sub">Rolle + Mean Value</text>
    <text x="16" y="59" class="sub">连接瞬时与平均变化</text>
  </g>

  <g class="node ch4" transform="translate(252 292)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.3 单调性</text>
    <text x="16" y="44" class="sub">First Derivative Test</text>
    <text x="16" y="59" class="sub">导数的符号</text>
  </g>

  <g class="node ch4" transform="translate(476 292)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.4 凹凸与作图</text>
    <text x="16" y="44" class="sub">Concavity · Inflection</text>
    <text x="16" y="59" class="sub">Second Derivative Test</text>
  </g>

  <g class="node ch4" transform="translate(476 184)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.5 应用最优化</text>
    <text x="16" y="44" class="sub">模型 + 约束 + 全局检查</text>
    <text x="16" y="59" class="sub">最大利润：r′ = c′</text>
  </g>

  <g class="node ch4" transform="translate(476 402)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.6 牛顿法</text>
    <text x="16" y="44" class="sub">切线零点逼近根</text>
    <text x="16" y="59" class="sub">不等同于保证收敛</text>
  </g>

  <g class="node ch4" transform="translate(252 402)">
    <rect width="184" height="66"/>
    <text x="16" y="24" class="title">4.7 原函数</text>
    <text x="16" y="44" class="sub">Antiderivatives + C</text>
    <text x="16" y="59" class="sub">初值问题与运动</text>
  </g>

  <g class="node ch5" transform="translate(590 86)">
    <rect width="206" height="66"/>
    <text x="16" y="24" class="title">5.1 有限和估计</text>
    <text x="16" y="44" class="sub">面积 · 位移 · 平均值</text>
    <text x="16" y="59" class="sub">上 / 下 / 中点和</text>
  </g>

  <g class="node ch5" transform="translate(590 184)">
    <rect width="206" height="66"/>
    <text x="16" y="24" class="title">5.2 Sigma 与 Riemann 和</text>
    <text x="16" y="44" class="sub">分割 · 范数 · 采样点</text>
    <text x="16" y="59" class="sub">求和公式</text>
  </g>

  <g class="node ch5" transform="translate(838 184)">
    <rect width="238" height="66"/>
    <text x="16" y="24" class="title">5.3 定积分</text>
    <text x="16" y="44" class="sub">Riemann 和统一极限</text>
    <text x="16" y="59" class="sub">性质 · 平均值 · 可积性</text>
  </g>

  <g class="node ch5" transform="translate(838 292)">
    <rect width="238" height="84"/>
    <text x="16" y="24" class="title">5.4 微积分基本定理</text>
    <text x="16" y="44" class="sub">累积函数求导 = 被积函数</text>
    <text x="16" y="60" class="sub">定积分 = F(b) − F(a)</text>
    <text x="16" y="76" class="sub">Net Change · Total Area</text>
  </g>

  <g class="node ch5" transform="translate(590 402)">
    <rect width="206" height="66"/>
    <text x="16" y="24" class="title">5.5 换元法则</text>
    <text x="16" y="44" class="sub">u = g(x), du = g′(x)dx</text>
    <text x="16" y="59" class="sub">反向使用链式法则</text>
  </g>

  <g class="node ch5" transform="translate(838 500)">
    <rect width="238" height="84"/>
    <text x="16" y="24" class="title">5.6 定积分换元与面积</text>
    <text x="16" y="44" class="sub">同步变换积分限</text>
    <text x="16" y="60" class="sub">奇偶函数对称性</text>
    <text x="16" y="76" class="sub">上下曲线 / 左右曲线</text>
  </g>

  <g class="node ghost" transform="translate(590 604)">
    <rect width="486" height="48"/>
    <text x="18" y="20" class="title">第 6 章：定积分应用</text>
    <text x="18" y="37" class="sub">示范范围外 · 不展开</text>
  </g>

  <g class="node system" transform="translate(28 548)">
    <rect width="408" height="102"/>
    <text x="18" y="27" class="title">贯穿两章的主线</text>
    <text x="18" y="49" class="sub">第 4 章：由导数读取函数性质，并反向寻找原函数。</text>
    <text x="18" y="68" class="sub">第 5 章：从有限近似走向极限，再用原函数计算积分。</text>
    <text x="18" y="87" class="sub">桥梁：原函数 + Fundamental Theorem of Calculus。</text>
  </g>

  <path class="edge" d="M212 108 C232 140 232 150 212 184"/>
  <path class="edge" d="M212 250 H252"/>
  <path class="edge" d="M344 250 V292"/>
  <path class="edge" d="M436 325 C474 325 486 325 476 250" transform="translate(0 0)"/>
  <path class="edge" d="M344 358 C390 360 420 240 476 223"/>
  <path class="edge" d="M660 217 H838"/>
  <path class="edge" d="M590 217 C574 217 550 240 520 230"/>
  <path class="edge" d="M796 217 C816 250 816 330 838 334"/>
  <path class="edge" d="M436 435 H252" transform="translate(0 0)"/>
  <path class="edge" d="M476 435 C442 435 438 435 436 435"/>
  <path class="edge" d="M568 435 C578 435 580 435 590 435"/>
  <path class="edge" d="M796 435 C814 461 820 510 838 530"/>
  <path class="edge" d="M957 376 V500"/>
  <path class="edge" d="M957 584 V604"/>

  <path class="cross" d="M344 435 C470 530 690 455 838 350"/>
  <text x="548" y="468" class="label">FTC：原函数 ↔ 定积分</text>

  <path d="M668 118 C687 142 724 160 838 202" class="edge"/>
  <text x="690" y="127" class="label">增加区间划分</text>
</svg>
